<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scan Location | Tech Treasure Hunt</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .location-code {
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.55;
            word-break: break-all;
        }

        .loading {
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.45; }
            100% { opacity: 1; }
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="game-container">

    <div class="game-card">

        <div class="logo">🔍</div>

        <h1 id="title">Checking QR...</h1>

        <p id="message" class="loading">
            Please wait while we verify this location.
        </p>

        <div id="statusBox" style="
            margin-top:25px;
            padding:20px;
            border-radius:15px;
            background:rgba(255,255,255,0.06);
            display:none;
        ">

            <div id="statusIcon" style="
                font-size:50px;
                margin-bottom:10px;
            ">📍</div>

            <h2 id="statusTitle"></h2>

            <p id="statusMessage" style="
                margin-top:10px;
                line-height:1.6;
                opacity:0.85;
            "></p>

            <div id="locationCode" class="location-code"></div>

        </div>

        <button
            id="retryBtn"
            onclick="location.reload()"
            style="display:none; margin-top:25px;"
        >
            🔄 Try Again
        </button>

        <button
            id="continueBtn"
            style="display:none; margin-top:15px;"
        >
            ➡️ Continue
        </button>

    </div>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey: "AIzaSyBAOyDtt9aODoo-5jTNGVOJGIcTuS2pVEk",

    authDomain: "treasure-edc7a.firebaseapp.com",

    projectId: "treasure-edc7a",

    storageBucket: "treasure-edc7a.firebasestorage.app",

    messagingSenderId: "370342872714",

    appId: "1:370342872714:web:3fce530217b3a3e1f14f73",

    measurementId: "G-C6EFHJDQJN"
};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================================
   HTML ELEMENTS
========================================= */

const title =
    document.getElementById("title");

const message =
    document.getElementById("message");

const statusBox =
    document.getElementById("statusBox");

const statusIcon =
    document.getElementById("statusIcon");

const statusTitle =
    document.getElementById("statusTitle");

const statusMessage =
    document.getElementById("statusMessage");

const locationCode =
    document.getElementById("locationCode");

const retryBtn =
    document.getElementById("retryBtn");

const continueBtn =
    document.getElementById("continueBtn");


/* =========================================
   ALL TREASURE HUNT LOCATIONS
========================================= */

const VALID_LOCATIONS = [

    /* ---------- BLOCK A ---------- */

    "block_a_main_gate",

    "block_a_computer_lab_1",

    "block_a_computer_lab_2",

    "block_a_chemistry_lab",

    "block_a_park_1",

    "block_a_park_2",

    "block_a_basketball_court",

    "block_a_water_cooler",

    "block_a_staircase",

    "block_a_ground_floor_corridor",

    "block_a_first_floor_corridor",

    "block_a_second_floor_corridor",


    /* ---------- BLOCK B ---------- */

    "block_b_ground_floor",

    "block_b_first_floor",

    "block_b_second_floor",

    "block_b_third_floor",

    "block_b_room_104",

    "block_b_room_108",

    "block_b_room_204",

    "block_b_room_208",

    "block_b_room_304",

    "block_b_room_308",

    "block_b_room_404",

    "block_b_room_408",

    "block_b_staircase",

    "block_b_water_cooler",


    /* ---------- BLOCK C ---------- */

    "block_c_main_area",

    "block_c_first_floor",

    "block_c_second_floor",

    "block_c_water_cooler",


    /* ---------- CAMPUS ---------- */

    "campus_flag_1",

    "campus_flag_2",

    "campus_flag_3",

    "campus_canteen",

    "campus_auditorium",

    "campus_seminar_hall"

];


/* =========================================
   NORMALIZE LOCATION
========================================= */

function normalizeLocation(value) {

    if (!value) {
        return "";
    }

    return value
        .toString()
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");

}


/* =========================================
   SHOW STATUS
========================================= */

function showStatus(
    icon,
    heading,
    text,
    type,
    code = ""
) {

    statusBox.style.display = "block";

    statusIcon.textContent = icon;

    statusTitle.textContent = heading;

    statusMessage.textContent = text;

    locationCode.textContent =
        code ? "Location Code: " + code : "";


    if (type === "success") {

        statusBox.style.border =
            "1px solid rgba(0,255,150,0.4)";

    } else if (type === "warning") {

        statusBox.style.border =
            "1px solid rgba(255,200,0,0.4)";

    } else {

        statusBox.style.border =
            "1px solid rgba(255,80,80,0.4)";
    }

}


/* =========================================
   HIDE BUTTONS
========================================= */

function hideButtons() {

    retryBtn.style.display = "none";

    continueBtn.style.display = "none";

}


/* =========================================
   SHOW ERROR
========================================= */

function showError(
    heading,
    text,
    icon = "❌"
) {

    title.textContent = heading;

    message.textContent = text;

    message.classList.remove("loading");

    showStatus(
        icon,
        heading,
        text,
        "error"
    );

    retryBtn.style.display = "block";

}


/* =========================================
   MAIN QR CHECK
========================================= */

async function checkLocation() {

    try {

        hideButtons();


        /* =====================================
           CHECK TEAM ID
        ===================================== */

        const teamId =
            localStorage.getItem("teamId");


        if (!teamId) {

            title.textContent =
                "Team Not Found";

            message.textContent =
                "Please join the Treasure Hunt first.";

            showStatus(
                "👥",
                "No Team Session",
                "You must register your team before scanning a location QR.",
                "error"
            );

            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 2000);

            return;
        }


        /* =====================================
           GET QR LOCATION
        ===================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const rawLocation =
            urlParams.get("location");


        /* =====================================
           CHECK QR PARAMETER
        ===================================== */

        if (!rawLocation) {

            showError(
                "Invalid QR Code",
                "This QR code does not contain a valid Treasure Hunt location."
            );

            return;
        }


        /* =====================================
           NORMALIZE LOCATION
        ===================================== */

        const scannedLocation =
            normalizeLocation(rawLocation);


        /* =====================================
           CHECK WHETHER QR IS OUR QR
        ===================================== */

        const isValidLocation =
            VALID_LOCATIONS.includes(
                scannedLocation
            );


        if (!isValidLocation) {

            showError(
                "Unknown QR Code",
                "This QR code is not registered for the Tech Treasure Hunt."
            );

            return;
        }


        /* =====================================
           GET TEAM FROM FIRESTORE
        ===================================== */

        const teamRef =
            doc(
                db,
                "teams",
                teamId
            );


        const teamSnapshot =
            await getDoc(teamRef);


        /* =====================================
           TEAM NOT FOUND
        ===================================== */

        if (!teamSnapshot.exists()) {

            localStorage.removeItem("teamId");

            showError(
                "Team Session Expired",
                "Your team session could not be found. Please register again.",
                "⚠️"
            );

            setTimeout(() => {

                window.location.href =
                    "index.html";

            }, 2500);

            return;
        }


        const team =
            teamSnapshot.data();


        /* =====================================
           GET EXPECTED LOCATION
        ===================================== */

        const expectedLocation =
            normalizeLocation(
                team.expectedLocation
            );


        /* =====================================
           NO ACTIVE LOCATION
        ===================================== */

        if (
            !expectedLocation ||
            expectedLocation === "none"
        ) {

            title.textContent =
                "No Active Clue";

            message.textContent =
                "There is currently no location waiting for verification.";

            message.classList.remove("loading");

            showStatus(
                "⚠️",
                "No Active Clue",
                "Answer the current question first. A correct answer will give your team the next location.",
                "warning"
            );

            retryBtn.style.display =
                "block";

            return;
        }


        /* =====================================
           COMPARE LOCATIONS
        ===================================== */

        if (
            scannedLocation ===
            expectedLocation
        ) {


            /* =================================
               CORRECT LOCATION
            ================================= */

            const currentLevel =
                Number(team.level || 1);


            /* -----------------------------
               DETERMINE FINAL LEVEL
            ----------------------------- */

            const isFinalLevel =
                currentLevel >= 5;


            /* =================================
               UPDATE FIRESTORE
            ================================= */

            await updateDoc(
                teamRef,
                {

                    locationVerified: true,

                    lastVerifiedLocation:
                        scannedLocation,

                    expectedLocation:
                        "none",

                    lastHint:
                        "",

                    lastScanTime:
                        new Date().toISOString()

                }
            );


            /* =================================
               SAVE LOCAL STATE
            ================================= */

            localStorage.setItem(
                "verifiedLocation",
                scannedLocation
            );


            localStorage.removeItem(
                "nextLocation"
            );


            localStorage.removeItem(
                "currentHint"
            );


            /* =================================
               FINAL LEVEL
            ================================= */

            if (isFinalLevel) {

                title.textContent =
                    "🏆 Final Location Verified!";

                message.textContent =
                    "Amazing! Your team has completed the final challenge.";

                message.classList.remove(
                    "loading"
                );


                showStatus(
                    "🏆",
                    "FINAL QR VERIFIED!",
                    "You have reached the finish. Proceed to the final result.",
                    "success",
                    scannedLocation
                );


                continueBtn.textContent =
                    "🏆 Finish Hunt";


                continueBtn.style.display =
                    "block";


                continueBtn.onclick =
                    function () {

                        window.location.href =
                            "finish.html";

                    };


                return;
            }


            /* =================================
               NORMAL LEVEL QR
            ================================= */

            title.textContent =
                "Location Verified!";

            message.textContent =
                "Great job! You found the correct location.";

            message.classList.remove(
                "loading"
            );


            showStatus(
                "✅",
                "Correct Location!",
                "Your team can continue to the next challenge.",
                "success",
                scannedLocation
            );


            continueBtn.textContent =
                "➡️ Continue";


            continueBtn.style.display =
                "block";


            continueBtn.onclick =
                function () {

                    window.location.href =
                        "question.html";

                };


        } else {


            /* =================================
               WRONG LOCATION
            ================================= */

            title.textContent =
                "Wrong Location ❌";

            message.textContent =
                "This QR code is not the location given by your clue.";

            message.classList.remove(
                "loading"
            );


            showStatus(
                "❌",
                "Wrong Location!",
                "Do not worry. Check your clue carefully and find the correct location.",
                "error",
                scannedLocation
            );


            retryBtn.style.display =
                "block";

        }

    }

    catch (error) {

        console.error(
            "QR verification error:",
            error
        );


        title.textContent =
            "Something Went Wrong";

        message.textContent =
            "Unable to verify the QR code right now.";

        message.classList.remove(
            "loading"
        );


        showStatus(
            "⚠️",
            "Verification Error",
            "Please check your internet connection and scan the QR again.",
            "error"
        );


        retryBtn.style.display =
            "block";

    }

}


/* =========================================
   START
========================================= */

checkLocation();

</script>

</body>
</html>
