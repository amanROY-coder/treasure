}

.top-row {

    align-items: center;

}

.team-badge {

.team-icon {

    font-size: 16px;

    box-shadow:

}


/* ---------- LOGO ---------- */

.question-logo {

    width: 86px;
    height: 86px;

    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background:

    font-size: 42px;

    box-shadow:

/* ---------- TITLE ---------- */

.page-title {

    text-align: center;

    font-size: 42px;

    font-weight: 900;

    letter-spacing: 1px;

    margin-bottom: 8px;

    background:

            #9ebaff,
            #d38cff

    -webkit-text-fill-color: transparent;
}


/* ---------- SUBTITLE ---------- */

.page-subtitle {

    text-align: center;

    color: #9da9cc;

    font-size: 14px;

    margin-bottom: 35px;
}


/* ---------- CHALLENGE LABEL ---------- */

.challenge-label {

    text-align: center;

    color: #91a5df;

    font-size: 12px;

    font-weight: 800;

    letter-spacing: 3px;

    margin-bottom: 15px;
}


/* ---------- QUESTION BOX ---------- */

.question-container {

    padding: 30px 25px;

    border-radius: 20px;

    background:

            rgba(8,12,28,0.65),

    box-shadow:

#questionText {

    color: #f4f6ff;

    text-align: center;

    font-size: 23px;

    line-height: 1.55;

    font-weight: 700;
}


/* ---------- OPTIONS ---------- */

.options-container {

    display: flex;

    flex-direction: column;

    gap: 14px;

    margin-top: 25px;
}


/* ---------- OPTION ---------- */

.answer-option {

    width: 100%;

    min-height: 70px;

    padding: 12px 18px;

    display: flex;

    align-items: center;

    gap: 15px;

    border-radius: 16px;

    background:
        rgba(255,255,255,0.045);

    border: 1px solid rgba(255,255,255,0.12);

    color: white;

    cursor: pointer;

    text-align: left;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border 0.2s ease,
        box-shadow 0.2s ease;
}


.answer-option:hover {

    transform: translateX(5px);

    background:
        rgba(90,110,255,0.12);

    border-color:
        rgba(100,140,255,0.55);

    box-shadow:
        0 8px 25px rgba(70,90,255,0.12);
}


/* ---------- LETTER ---------- */

.answer-letter {

    min-width: 45px;
    height: 45px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 12px;

    background:
        rgba(90,115,255,0.14);

    color: #a9baff;

    font-size: 16px;

    font-weight: 800;

    border: 1px solid rgba(120,140,255,0.12);

    font-size: 16px;

    line-height: 1.4;

    color: #e3e8fa;
}

            #4d7fff,
            #8a45ff

    box-shadow:

#submitAnswer:hover {

    transform: translateY(0);

#submitAnswer:disabled {

{
slug:"campus_flag_3",
hint:"Search around the third campus flag."
},

{
slug:"campus_canteen",
hint:"Look where students go when they are hungry."
},

{
slug:"campus_auditorium",
hint:"Find the place where large events and programs are held."
},

{
slug:"campus_seminar_hall",
hint:"Look for the hall where seminars and presentations take place."
}

];


/* =========================================
   STATE
========================================= */

let teamData = null;

let currentQuestion = null;

let selectedAnswer = null;


/* =========================================
   RANDOM QUESTION
========================================= */

function getRandomQuestion(level) {

    const bank =
        QUESTIONS[level] || QUESTIONS[1];

    return bank[
        Math.floor(
            Math.random() * bank.length
        )
    ];

}


/* =========================================
   RANDOM LOCATION
========================================= */

function getRandomLocation() {

    return LOCATIONS[
        Math.floor(
            Math.random() * LOCATIONS.length
        )
    ];

}


/* =========================================
   SHOW QUESTION
========================================= */

function showQuestion() {

    const level =
        Number(teamData.level || 1);

    currentQuestion =
        getRandomQuestion(level);

    selectedAnswer = null;

    levelNumber.textContent =
        level;

    questionText.textContent =
        currentQuestion.q;

    optionsContainer.innerHTML = "";

    const letters =
        ["A","B","C","D"];


    currentQuestion.options.forEach(
        (option,index) => {

            const button =
                document.createElement("button");

            button.className =
                "answer-option";

            button.innerHTML = `

                <div class="answer-letter">
                    ${letters[index]}
                </div>

                <div class="answer-text">
                    ${option}
                </div>

            `;


            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".answer-option"
                        )
                        .forEach(
                            el =>
                                el.classList.remove(
                                    "selected"
                                )
                        );

                    button.classList.add(
                        "selected"
                    );

                    selectedAnswer =
                        index;

                    submitAnswer.disabled =
                        false;

                }
            );


            optionsContainer.appendChild(
                button
            );

        }
    );


    challengeNumber.textContent =
        Math.floor(
            Math.random() * 99
        ) + 1;


    progressText.textContent =
        `Level ${level} of 5`;

    progressFill.style.width =
        `${level * 20}%`;

}


/* =========================================
   POPUP
========================================= */

function showPopup(
    icon,
    title,
    message,
    buttonText,
    callback
) {

    popupIcon.textContent =
        icon;

    popupTitle.textContent =
        title;

    popupMessage.textContent =
        message;

    popupButton.textContent =
        buttonText;

    popupOverlay.classList.add(
        "show"
    );


    popupButton.onclick = () => {

        popupOverlay.classList.remove(
            "show"
        );

        callback();

    };

}


/* =========================================
   WRONG ANSWER SOUND
========================================= */

function playWrongSound() {

    try {

        const audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sawtooth";

        oscillator.frequency.value =
            180;


        gain.gain.setValueAtTime(
            0.25,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioContext.currentTime + 0.45
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + 0.45
        );

    }

    catch(error) {

        console.log(
            "Sound unavailable"
        );

    }

}


/* =========================================
   CORRECT SOUND
========================================= */

function playCorrectSound() {

    try {

        const audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";

        oscillator.frequency.setValueAtTime(
            600,
            audioContext.currentTime
        );

        oscillator.frequency.setValueAtTime(
            900,
            audioContext.currentTime + 0.12
        );


        gain.gain.setValueAtTime(
            0.20,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.01,
            audioContext.currentTime + 0.5
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + 0.5
        );

    }

    catch(error) {

        console.log(
            "Sound unavailable"
        );

    }

}


/* =========================================
   SUBMIT ANSWER
========================================= */

submitAnswer.addEventListener(
    "click",
    async () => {

        if (
            selectedAnswer === null ||
            !currentQuestion
        ) {

            return;

        }


        submitAnswer.disabled =
            true;


        /* =================================
           WRONG
        ================================= */

        if (
            selectedAnswer !==
            currentQuestion.answer
        ) {

            playWrongSound();


            try {

                const teamRef =
                    doc(
                        db,
                        "teams",
                        teamId
                    );

                await updateDoc(
                    teamRef,
                    {
                        attempts:
                            (teamData.attempts || 0) + 1
                    }
                );

            }

            catch(error) {

                console.error(error);

            }


            showPopup(

                "❌",

                "Wrong Answer!",

                "That's not correct. Think again and try the next challenge.",

                "🔄 Try Again",

                () => {

                    submitAnswer.disabled =
                        true;

                    showQuestion();

                }

            );

            return;

        }


        /* =================================
           CORRECT
        ================================= */

        playCorrectSound();


        const level =
            Number(teamData.level || 1);


        const location =
            getRandomLocation();


        const newScore =
            Number(teamData.score || 0) + 10;


        const teamRef =
            doc(
                db,
                "teams",
                teamId
            );


        /* =================================
           LEVEL 1-4
        ================================= */

        if (level < 5) {

            const nextLevel =
                level + 1;


            await updateDoc(
                teamRef,
                {

                    score:
                        newScore,

                    level:
                        nextLevel,

                    expectedLocation:
                        location.slug,

                    lastHint:
                        location.hint,

                    lastLocation:
                        location.slug,

                    locationVerified:
                        false

                }
            );


            teamData.score =
                newScore;

            teamData.level =
                nextLevel;


            localStorage.setItem(
                "nextLocation",
                location.slug
            );

            localStorage.setItem(
                "currentHint",
                location.hint
            );


            showPopup(

                "🎯",

                "Correct Answer!",

                `Great job! You earned 10 points.\n\nNext clue: ${location.hint}`,

                "➡️ View Clue",

                () => {

                    window.location.href =
                        "result.html";

                }

            );

        }


        /* =================================
           FINAL LEVEL
        ================================= */

        else {

            await updateDoc(
                teamRef,
                {

                    score:
                        newScore,

                    expectedLocation:
                        location.slug,

                    lastHint:
                        location.hint,

                    lastLocation:
                        location.slug,

                    locationVerified:
                        false

                }
            );


            teamData.score =
                newScore;


            localStorage.setItem(
                "nextLocation",
                location.slug
            );

            localStorage.setItem(
                "currentHint",
                location.hint
            );


            showPopup(

                "🏆",

                "Final Challenge Complete!",

                `Amazing! You have completed all 5 levels.\n\nNow find the FINAL QR code at: ${location.hint}`,

                "📍 Go To Final Clue",

                () => {

                    window.location.href =
                        "result.html";

                }

            );

        }

    }
);


/* =========================================
   LOAD TEAM
========================================= */

async function loadTeam() {

    try {

        const teamRef =
            doc(
                db,
                "teams",
                teamId
            );


        const snapshot =
            await getDoc(teamRef);


        if (!snapshot.exists()) {

            localStorage.clear();

            window.location.href =
                "index.html";

            return;

        }


        teamData =
            snapshot.data();


        teamName.textContent =
            teamData.name ||
            "Team";


        const level =
            Number(
                teamData.level || 1
            );


        levelNumber.textContent =
            level;


        /* ---------------------------------
           FINISHED
        --------------------------------- */

        if (teamData.finished) {

            window.location.href =
                "final.html";

            return;

        }


        /* ---------------------------------
           QR VERIFICATION
        --------------------------------- */

        if (
            level > 1 &&
            teamData.locationVerified !== true
        ) {

            window.location.href =
                "result.html";

            return;

        }


        showQuestion();

    }

    catch(error) {

        console.error(
            "Team loading error:",
            error
        );

        questionText.textContent =
            "Unable to load challenge.";

    }

}


/* =========================================
   START
========================================= */

loadTeam();

</script>
